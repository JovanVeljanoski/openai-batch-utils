name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: [3.12]
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "0.9.28"
        python-version: ${{ matrix.python-version }}
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"

    - name: Install dependencies
      run: |
        uv pip install -r <(uv pip compile --extra dev pyproject.toml)

    - name: Linting and code formatting
      run: |
        uv run flake8 openai_batch_utils tests
        uv run black openai_batch_utils tests --check

    - name: Run tests
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        uv run pytest tests/ --verbose --timeout=300

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
